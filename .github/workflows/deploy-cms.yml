name: Deploy CMS to VPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cms/**"
      - ".github/workflows/deploy-cms.yml"
jobs:
  deploy:
    name: Pull, build and restart CMS on the VPS
    runs-on: ubuntu-latest
    env:
      VPS_CMS_DOMAIN: ${{ secrets.VPS_CMS_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            CMS_ROOT=/opt/abc/cms
            sudo mkdir -p $CMS_ROOT
            sudo chown $USER:$USER $CMS_ROOT
            cd $CMS_ROOT
            git init
            git remote add origin https://github.com/ashokabusinessclub/website.git 2>/dev/null || true
            git pull origin main
            cd cms
            mkdir -p public/media
            npm ci
            npm run build
            npm run seed || true
            # Copy standalone assets
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
            # Copy public assets if needed
            mkdir -p .next/standalone/public
            cp -r public/* .next/standalone/public/ 2>/dev/null || true
            # Ensure systemd service directory exists
            sudo mkdir -p /etc/systemd/system
            # Always write the service file (overwrite if exists)
            sudo tee /etc/systemd/system/abc-cms.service > /dev/null <<'EOF'
            [Unit]
            Description=ABC CMS (Payload/Next standalone)
            After=network.target postgresql.service
            [Service]
            Type=simple
            WorkingDirectory=/opt/abc/cms/cms/.next/standalone
            EnvironmentFile=/opt/abc/cms/cms/.env
            ExecStart=/usr/bin/node server.js
            Restart=always
            RestartSec=5
            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable --now abc-cms
            sudo systemctl restart abc-cms
      - name: Verify CMS health
        if: ${{ env.VPS_CMS_DOMAIN != '' }}
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://${{ env.VPS_CMS_DOMAIN }}/api/health"