name: Deploy CMS to VPS

on:
  push:
    branches: [main]
    paths:
      - "cms/**"

jobs:
  deploy:
    name: Pull, build and restart CMS on the VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/abc/repo
            git pull --ff-only origin main
            cd cms
            npm ci
            npm run build
            sudo systemctl restart abc-cms

      - name: Verify CMS health
        if: ${{ secrets.VPS_CMS_DOMAIN != '' }}
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://${{ secrets.VPS_CMS_DOMAIN }}/api/health"