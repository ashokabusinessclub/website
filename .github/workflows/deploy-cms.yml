name: Deploy CMS to VPS

on:
  push:
    branches: [main]
    paths:
      - "cms/**"

jobs:
  deploy:
    name: Pull, build and restart CMS on the VPS
    runs-on: ubuntu-latest
    env:
      VPS_CMS_DOMAIN: ${{ secrets.VPS_CMS_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/abc/repo
            git pull --ff-only origin main
            cd cms
            npm ci
            npm run build
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/ 2>/dev/null || true
            # Ensure systemd service exists
            if [ ! -f /etc/systemd/system/abc-cms.service ]; then
              cat > /etc/systemd/system/abc-cms.service <<'EOF'
[Unit]
Description=ABC CMS (Payload/Next standalone)
After=network.target postgresql.service

[Service]
Type=simple
WorkingDirectory=/opt/abc/repo/cms/.next/standalone
EnvironmentFile=/opt/abc/repo/cms/.env
ExecStart=/usr/bin/node server.js
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF
              systemctl daemon-reload
              systemctl enable --now abc-cms
            fi
            sudo systemctl restart abc-cms

      - name: Verify CMS health
        if: ${{ env.VPS_CMS_DOMAIN != '' }}
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            "https://${{ env.VPS_CMS_DOMAIN }}/api/health"
